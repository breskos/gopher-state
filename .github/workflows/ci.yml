name: CI

on: [push, pull_request]

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable]
        include:
          - os: ubuntu-latest
            go: oldstable
          - os: ubuntu-latest
            go: '1.25.0'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
          check-latest: true
      - name: Check formatting and module metadata
        if: runner.os == 'Linux' && matrix.go == 'stable'
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy -diff
      - run: go vet ./...
      - run: go test -race -cover ./...
        if: runner.os != 'Windows'
      - run: go test -cover ./...
        if: runner.os == 'Windows'
      - name: Fuzz NFA matching and determinization
        if: runner.os == 'Linux' && matrix.go == 'stable'
        run: go test -run '^$' -fuzz '^FuzzDeterminize$' -fuzztime=15s -parallel=2 .
